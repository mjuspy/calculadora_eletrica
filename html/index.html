<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Circuito Elétrico</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="cabecalho">
            <img src="../img/lampada.jpg" alt="Lâmpada">
            <h1>Calculadora Circuito Elétrico</h1>
        </div>

        <div class="secao">
            <h2>Tipo de Circuito</h2>
            <div class="campo">
                <label for="tipo">Tipo de Associação:</label>
                <select id="tipo" onchange="gerarCamposResistores()">
                    <option value="serie">Série</option>
                    <option value="paralelo">Paralelo</option>
                    <option value="misto">Mista</option>
                </select>
            </div>
        </div>

        <div class="secao">
            <h2>Geradores em Série</h2>
            <div class="campo">
                <label for="qtdGeradores">Quantidade de Geradores:</label>
                <input type="number" id="qtdGeradores" value="1" min="1" onchange="gerarCamposGeradores()">
            </div>
            <div id="containerGeradores" class="campos-dinamicos"></div>
        </div>

        <div class="secao">
            <h2>Resistores</h2>
            <div class="campo">
                <label for="qtdResistores">Quantidade de Resistores:</label>
                <input type="number" id="qtdResistores" value="3" min="1" onchange="gerarCamposResistores()">
            </div>
            <div id="containerResistores" class="campos-dinamicos"></div>
        </div>

        <button onclick="calcular()">Calcular Circuito</button>

        <div class="painel-resultados" id="painelResultados">
            <h2>Resultados</h2>

            <div class="stats-grid">
                <div class="box">
                    <span class="stat-label">Tensão Total das Fontes</span>
                    <span><span id="vTotal" class="stat-valor">0</span> V</span>
                </div>
                <div class="box">
                    <span class="stat-label">Resistência Equivalente</span>
                    <span><span id="req" class="stat-valor">0</span> Ω</span>
                </div>
                <div class="box">
                    <span class="stat-label">Corrente Total</span>
                    <span><span id="iTotal" class="stat-valor">0</span> A</span>
                </div>
                <div class="box">
                    <span class="stat-label">Potência Total Fornecida</span>
                    <span><span id="pTotal" class="stat-valor">0</span> W</span>
                </div>
            </div>

            <h2>Detalhamento por Resistor</h2>
            <div class="tabela-wrap">
                <table class="tabela-resistores">
                    <thead>
                        <tr>
                            <th>Resistor</th>
                            <th>Valor (Ω)</th>
                            <th>Tensão (V)</th>
                            <th>Corrente (A)</th>
                            <th>Potência (W)</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaResistores"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
